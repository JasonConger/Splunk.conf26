# ai_sandbox — a landing zone for AI-generated Splunk content.
# Everything an agent creates goes here, so it can be reviewed, promoted or
# deleted as a unit without touching production apps.

[package]
id = ai_sandbox
check_for_updates = false

[id]
name = ai_sandbox
version = 0.1.0

[ui]
is_visible = 1
label = AI Sandbox
show_in_nav = 1

[launcher]
author = <your name>
description = Sandbox for dashboards, searches and alerts built with an AI agent. Review before promoting.
version = 0.1.0

[install]
# Must be 0 for Splunk Cloud vetting. 1 fails AppInspect.
is_configured = 0
state = enabled
build = 1
