#
# savedsearches.conf — a summary-index rollup and an alert, valid keys only.
#
# Both searches read index=_internal, so they run on any Splunk instance.
# Copy the stanzas into <your_app>/default/savedsearches.conf and adapt.
#
# ---------------------------------------------------------------------------
# Keys models write that are NOT valid. Each one logs
# "Invalid key in stanza" on every Splunk restart.
#
#   Wrong               Right
#   is_scheduled        enableSched
#   alert_type          counttype
#   alert_comparator    relation
#   alert_threshold     quantity
#   is_visible          (none — use disabled)
#
# Also: alert.suppress.period takes a duration ("4h"), not a bare integer.
# ---------------------------------------------------------------------------


# Rollup: hourly splunkd error counts per component into index=summary.
# Dashboards and alerts read ~24 rows a day instead of scanning _internal.
# Backfill history by running the search over a wider range with
# | collect index=summary marker="report=splunkd_errors_hourly"
[AI Sandbox - splunkd errors hourly rollup]
description = Hourly count of splunkd ERROR events per component, written to index=summary as report=splunkd_errors_hourly.
search = index=_internal sourcetype=splunkd log_level=ERROR \
| bin _time span=1h \
| stats count as errors by _time, component
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 5 * * * *
enableSched = 1
action.summary_index = 1
action.summary_index._name = summary
action.summary_index.report = splunkd_errors_hourly


# Alert: fires when any scheduled search was skipped in the last hour.
# The condition lives in the SPL (| where), so the trigger is "any rows".
# alert.track = 1 records hits in Activity > Triggered Alerts and notifies
# no one. Add an action (action.email, action.webhook) only when asked.
[AI Sandbox - Scheduled searches skipped]
description = Fires when the scheduler skipped one or more searches in the last hour, usually a concurrency limit.
search = index=_internal sourcetype=scheduler status=skipped \
| stats count as skipped, dc(savedsearch_name) as searches_affected \
| where skipped>0 \
| eval message=skipped." scheduled runs skipped across ".searches_affected." searches in the last hour."
dispatch.earliest_time = -1h@h
dispatch.latest_time = @h
cron_schedule = 10 * * * *
enableSched = 1
counttype = number of events
relation = greater than
quantity = 0
alert.digest_mode = 1
alert.severity = 3
alert.track = 1
alert.expires = 24h
alert.suppress = 1
alert.suppress.period = 4h
